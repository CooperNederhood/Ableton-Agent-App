name: Bug report
description: Report a reproducible Ableton Agent failure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App, Remote Script, Ableton Live, and OS versions
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Never include tokens, prompts, project content, or private paths.
  - type: textarea
    id: regression-test
    attributes:
      label: Regression test plan
    validations:
      required: true
