name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real-Live qualification is an operator-triggered local suite, not hosted CI.
  # Static checks and tests run as parallel jobs so the wait is the longer of
  # the two, not their sum.
  validate:
    name: validate (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [static, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: Check protocol backward compatibility
        if: github.event_name == 'pull_request' && matrix.suite == 'static'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          pnpm contracts:compat "origin/${{ github.base_ref }}"
      - name: Build
        run: pnpm build
      - name: Run ${{ matrix.suite }} checks
        run: pnpm check:${{ matrix.suite }}

  platform-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
