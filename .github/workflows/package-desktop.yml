name: Package desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "remote-script/**"
      - "config/product-versions.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/package-desktop.yml"

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm build
      - run: pnpm exec playwright test --project=electron
      - run: pnpm --filter @ableton-agent/desktop dist --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-14
          path: release/
          if-no-files-found: error
