name: Package desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "remote-script/**"
      - "config/product-versions.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/package-desktop.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm --filter @ableton-agent/desktop dist --mac
          - os: windows-2022
            command: pnpm --filter @ableton-agent/desktop dist --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm build
      - if: runner.os == 'macOS'
        run: pnpm exec playwright test --project=electron
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/
          if-no-files-found: error
