name: Package desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "tests/electron/**"
      - "scripts/acceptance.mjs"
      - "scripts/lib/acceptance-*.ts"
      - "scripts/lib/live-host-lease.*"
      - "scripts/lib/live-process-controller.*"
      - "integration/acceptance-scenarios/**"
      - "integration/fixtures/**"
      - "playwright.config.ts"
      - "tsconfig.base.json"
      - "pnpm-workspace.yaml"
      - "agents/**"
      - "skills/**"
      - "remote-script/**"
      - "max-patches/**"
      - "packages/ableton-contracts/**"
      - "packages/agent-config/**"
      - "packages/application/**"
      - "packages/bridge/**"
      - "packages/correlation/**"
      - "packages/debug-control/**"
      - "packages/observability/**"
      - "packages/project-state/**"
      - "packages/protocol/**"
      - "packages/runtime/**"
      - "packages/shared/**"
      - "packages/signal-routing/**"
      - "packages/storage/**"
      - "packages/test-support/**"
      - "packages/tools/**"
      - "scripts/*device*.mjs"
      - "scripts/m4l-producer-companions.mjs"
      - "scripts/build-ableton-integrations.mjs"
      - "scripts/generate-product-versions.mjs"
      - "scripts/lib/native-listening-lifecycle.mjs"
      - "scripts/lib/native-metric-protocol-bundle.mjs"
      - "config/product-versions.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/package-desktop.yml"

jobs:
  package:
    # Artifact construction is not licensed real-Live qualification.
    # Use the local acceptance suite and candidate-bound verifier before release.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions:check
      - run: pnpm build
      - run: node scripts/build-ableton-integrations.mjs
      - run: pnpm exec playwright test --project=electron
      - run: pnpm --filter @ableton-agent/desktop dist --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-14
          path: release/
          if-no-files-found: error
